name: Windows acceptance

on:
  workflow_dispatch:
    inputs:
      validation_tag:
        description: Draft validation release tag
        required: true
        default: validation-v1.4.0

permissions:
  contents: none

jobs:
  prepare-assets:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write # Draft releases require push-level access; this job never runs LeafNote.
    steps:
      - name: Download and verify validation binaries
        shell: powershell
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_TAG: ${{ inputs.validation_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'LeafNote-Acceptance' }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers $headers
          $release = $releases | Where-Object tag_name -eq $env:VALIDATION_TAG | Select-Object -First 1
          if (-not $release -or -not $release.draft) { throw 'Validation draft release missing' }
          $expected = @{
            'LeafNote-1.4.0-Windows-x64-Setup.exe' = '90D810AC25FD9242EA03C5EDB8B4922BD7C0CD76CD8300B7A529D8FF88626878'
            'LeafNote-1.4.0-Windows-x64-Portable.exe' = '11334B316B91B7DCA32534DFFF738D7C810F9ED6497BFF227E4E56F979383D09'
            'Note-App-1.3.6-Windows-x64-Setup.exe' = 'F6DF23B28B3C8A462FCFFEB199A3C2F3552E4DDC59A3018EE8C15BEF72591C06'
          }
          foreach ($name in $expected.Keys) {
            $asset = $release.assets | Where-Object name -eq $name | Select-Object -First 1
            if (-not $asset) { throw "Validation asset missing: $name" }
            $headers.Accept = 'application/octet-stream'
            $destination = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile $destination -UseBasicParsing
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash
            if ($actual -ne $expected[$name]) { throw "$name SHA mismatch: $actual" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-binaries
          path: ${{ runner.temp }}\*.exe
          retention-days: 1
  fresh-install:
    needs: prepare-assets
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: none
    env:
      VALIDATION_TAG: ${{ inputs.validation_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-binaries
          path: ${{ runner.temp }}
      - name: Install, save title and body through UI, and uninstall
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LEAFNOTE_WATCHDOG_PARENT_PID = [string]$PID
          $env:ACCEPTANCE_WATCHDOG_SECONDS = '240'
          $env:LEAFNOTE_WATCHDOG_SECONDS = $env:ACCEPTANCE_WATCHDOG_SECONDS
          $watchdogBody = '$parentPid = [int]$env:LEAFNOTE_WATCHDOG_PARENT_PID' + "`n" + '$seconds = [int]$env:LEAFNOTE_WATCHDOG_SECONDS' + "`n" + 'Start-Sleep -Seconds $seconds' + "`n" + 'Stop-Process -Id $parentPid -Force -ErrorAction SilentlyContinue'
          $watchdogEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($watchdogBody))
          $watchdog = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-NonInteractive','-EncodedCommand',$watchdogEncoded) -PassThru -WindowStyle Hidden
          try {
          $setup = Join-Path $env:RUNNER_TEMP 'LeafNote-1.4.0-Windows-x64-Setup.exe'
          $portable = Join-Path $env:RUNNER_TEMP 'LeafNote-1.4.0-Windows-x64-Portable.exe'
          $setupSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned build, got $($signature.Status)" }
          $installer = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $installer.WaitForExit(120000)) { Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue; throw 'Installer exceeded 120 seconds' }
          if ($installer.ExitCode -ne 0) { throw "Installer exit code $($installer.ExitCode)" }
          Start-Sleep -Seconds 4
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'LeafNote' | Select-Object -First 1
          if (-not $entry -or $entry.DisplayVersion -ne '1.4.0') { throw 'LeafNote uninstall registration/version missing' }
          if ($entry.UninstallString -match '^"([^"]+)"') { $uninstaller = $Matches[1] } else { $uninstaller = $entry.UninstallString }
          $installDir = Split-Path -Parent $uninstaller
          $app = Get-ChildItem -LiteralPath $installDir -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'unins|uninstall' -and $_.VersionInfo.ProductName -eq 'LeafNote' } |
            Select-Object -First 1
          if (-not $app -or $app.VersionInfo.ProductVersion -ne '1.4.0') { throw 'Installed LeafNote PE metadata mismatch' }
          $portableSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $portable).Hash
          $appSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $app.FullName).Hash
          $links = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu') -Filter 'LeafNote*.lnk' -Recurse -ErrorAction SilentlyContinue)
          if ($links.Count -lt 1) { throw 'LeafNote shortcut missing' }
          $associationKeys = @(
            'Registry::HKEY_CURRENT_USER\Software\Classes\md\shell\open\command',
            'Registry::HKEY_CURRENT_USER\Software\Classes\markdown\shell\open\command'
          )
          foreach ($associationKey in $associationKeys) {
            $openCommand = (Get-ItemProperty -LiteralPath $associationKey -ErrorAction Stop).'(default)'
            if (-not $openCommand -or -not $openCommand.Contains($app.FullName)) {
              throw "LeafNote file association command missing at ${associationKey}: $openCommand"
            }
          }
          $library = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Note App Library'
          $before = @()
          if (Test-Path -LiteralPath $library) { $before = @(Get-ChildItem -LiteralPath $library -Filter '*.md' -Recurse | ForEach-Object FullName) }
          $token = "GHA-$env:GITHUB_RUN_ID"
          $title = "LeafNote title $token"
          $body = "LeafNote body $token"
          $process = Start-Process -FilePath $app.FullName -PassThru
          Write-Host 'ACCEPTANCE_PHASE app-started'
          $shell = New-Object -ComObject WScript.Shell
          $active = $false
          for ($i=0; $i -lt 20 -and -not $active; $i++) { Start-Sleep -Milliseconds 500; $active = $shell.AppActivate('LeafNote') }
          if (-not $active) { throw 'LeafNote window did not become active' }
          Write-Host 'ACCEPTANCE_PHASE window-active'
          for ($i=0; $i -lt 30 -and -not (Test-Path -LiteralPath $library); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $library)) { throw 'LeafNote did not finish first-run initialization' }
          Start-Sleep -Seconds 2
          $shell.SendKeys('^n'); Start-Sleep -Seconds 1
          $shell.SendKeys($title); $shell.SendKeys('{ENTER}'); Start-Sleep -Seconds 2
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          for ($i=0; $i -lt 20 -and $process.MainWindowHandle -eq 0; $i++) { $process.Refresh(); Start-Sleep -Milliseconds 250 }
          if ($process.MainWindowHandle -eq 0) { throw 'LeafNote main window handle was unavailable' }
          $windowElement = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
          $bodyName = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('56yU6K6w5q2j5paH57yW6L6R5Zmo'))
          $bodyCondition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, $bodyName)
          $bodyElement = $null
          Write-Host 'ACCEPTANCE_PHASE uia-search-started'
          for ($i=0; $i -lt 20 -and -not $bodyElement; $i++) {
            $bodyElement = $windowElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $bodyCondition)
            if (-not $bodyElement) { Start-Sleep -Milliseconds 250 }
          }
          if (-not $bodyElement) { throw 'LeafNote body editor was unavailable through UI Automation' }
          $bodyElement.SetFocus()
          Write-Host 'ACCEPTANCE_PHASE uia-focus-complete'
          Start-Sleep -Milliseconds 300
          Write-Host 'ACCEPTANCE_PHASE note-save-started'
          $shell.SendKeys($body); $shell.SendKeys('^s')
          Start-Sleep -Seconds 5
          $newNotes = @(Get-ChildItem -LiteralPath $library -Filter '*.md' -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -notin $before)
          $saved = $newNotes | Where-Object {
            $content = Get-Content -LiteralPath $_.FullName -Raw
            $content.Contains($title) -and $content.Contains($body)
          } | Select-Object -First 1
          if (-not $saved) {
            foreach ($candidate in $newNotes) {
              $diagnosticContent = Get-Content -LiteralPath $candidate.FullName -Raw
              $diagnosticBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($diagnosticContent))
              Write-Host "DIAGNOSTIC_NOTE path=$($candidate.FullName) base64=$diagnosticBase64"
            }
            throw 'Title and body were not saved together in one new Markdown file'
          }
          $noteSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $saved.FullName).Hash
          Write-Host 'ACCEPTANCE_PHASE saved-note-verified'
          Write-Host 'ACCEPTANCE_PHASE note-save-verified'
          $shell.SendKeys('%{F4}')
          $running = @()
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $running = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object ExecutablePath -eq $app.FullName)
            if ($running.Count -eq 0) { break }
          }
          if ($running.Count -ne 0) {
            $running | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            throw 'LeafNote did not close normally after UI save'
          }
          Write-Host 'ACCEPTANCE_PHASE app-exit-verified'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          if (-not $uninstall.WaitForExit(120000)) { Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue; throw 'Uninstaller exceeded 120 seconds' }
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          if (-not (Test-Path -LiteralPath $saved.FullName)) { throw 'Uninstall deleted Markdown data' }
          $remaining = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu') -Filter 'LeafNote*.lnk' -Recurse -ErrorAction SilentlyContinue)
          if ($remaining.Count -ne 0) { throw 'LeafNote shortcut remained after uninstall' }
          [pscustomobject]@{
            schemaVersion=1; scenario='fresh-install-ui-save-uninstall'; repo=$env:GITHUB_REPOSITORY
            runId=$env:GITHUB_RUN_ID; headSha=$env:GITHUB_SHA; validationTag=$env:VALIDATION_TAG
            product='LeafNote'; version='1.4.0'; setupSha=$setupSha; portableSha=$portableSha; appSha=$appSha; signature=$signature.Status.ToString()
            installerExitCode=$installer.ExitCode; uninstallerExitCode=$uninstall.ExitCode
            appPath=$app.FullName; notePath=$saved.FullName; noteSha=$noteSha
            titleFound=$true; bodyFound=$true; markdownPreserved=$true; shortcutRemoved=$true
            recordedAt=(Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fresh-evidence.json') -Encoding UTF8
          } finally {
            if ($watchdog -and -not $watchdog.HasExited) { Stop-Process -Id $watchdog.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-evidence-fresh
          path: ${{ runner.temp }}\fresh-evidence.json

  portable:
    needs: prepare-assets
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: none
    env:
      VALIDATION_TAG: ${{ inputs.validation_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-binaries
          path: ${{ runner.temp }}
      - name: Run Portable, save through UI, and exit normally
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LEAFNOTE_WATCHDOG_PARENT_PID = [string]$PID
          $env:ACCEPTANCE_WATCHDOG_SECONDS = '240'
          $env:LEAFNOTE_WATCHDOG_SECONDS = $env:ACCEPTANCE_WATCHDOG_SECONDS
          $watchdogBody = '$parentPid = [int]$env:LEAFNOTE_WATCHDOG_PARENT_PID' + "`n" + '$seconds = [int]$env:LEAFNOTE_WATCHDOG_SECONDS' + "`n" + 'Start-Sleep -Seconds $seconds' + "`n" + 'Stop-Process -Id $parentPid -Force -ErrorAction SilentlyContinue'
          $watchdogEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($watchdogBody))
          $watchdog = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-NonInteractive','-EncodedCommand',$watchdogEncoded) -PassThru -WindowStyle Hidden
          try {
          $portable = Join-Path $env:RUNNER_TEMP 'LeafNote-1.4.0-Windows-x64-Portable.exe'
          $portableSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $portable).Hash
          if ($portableSha -ne '11334B316B91B7DCA32534DFFF738D7C810F9ED6497BFF227E4E56F979383D09') { throw "Portable SHA mismatch: $portableSha" }
          $version = (Get-Item -LiteralPath $portable).VersionInfo
          if ($version.ProductName -ne 'LeafNote' -or $version.ProductVersion -ne '1.4.0') { throw 'Portable PE metadata mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $portable
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned Portable, got $($signature.Status)" }
          $library = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Note App Library'
          $before = @()
          if (Test-Path -LiteralPath $library) { $before = @(Get-ChildItem -LiteralPath $library -Filter '*.md' -Recurse | ForEach-Object FullName) }
          $token = "PORTABLE-$env:GITHUB_RUN_ID"
          $title = "Portable title $token"
          $body = "Portable body $token"
          $process = Start-Process -FilePath $portable -PassThru
          Write-Host 'ACCEPTANCE_PHASE app-started'
          $shell = New-Object -ComObject WScript.Shell
          $active = $false
          for ($i=0; $i -lt 20 -and -not $active; $i++) { Start-Sleep -Milliseconds 500; $active = $shell.AppActivate('LeafNote') }
          if (-not $active) { throw 'Portable LeafNote window did not become active' }
          Write-Host 'ACCEPTANCE_PHASE window-active'
          for ($i=0; $i -lt 30 -and -not (Test-Path -LiteralPath $library); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $library)) { throw 'Portable LeafNote did not finish first-run initialization' }
          Start-Sleep -Seconds 2
          $shell.SendKeys('^n'); Start-Sleep -Seconds 1
          $shell.SendKeys($title); $shell.SendKeys('{ENTER}'); Start-Sleep -Seconds 2
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          for ($i=0; $i -lt 20 -and $process.MainWindowHandle -eq 0; $i++) { $process.Refresh(); Start-Sleep -Milliseconds 250 }
          if ($process.MainWindowHandle -eq 0) { throw 'Portable LeafNote main window handle was unavailable' }
          $windowElement = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
          $bodyName = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('56yU6K6w5q2j5paH57yW6L6R5Zmo'))
          $bodyCondition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, $bodyName)
          $bodyElement = $null
          Write-Host 'ACCEPTANCE_PHASE uia-search-started'
          for ($i=0; $i -lt 20 -and -not $bodyElement; $i++) {
            $bodyElement = $windowElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $bodyCondition)
            if (-not $bodyElement) { Start-Sleep -Milliseconds 250 }
          }
          if (-not $bodyElement) { throw 'Portable LeafNote body editor was unavailable through UI Automation' }
          $bodyElement.SetFocus(); Write-Host 'ACCEPTANCE_PHASE uia-focus-complete'; Start-Sleep -Milliseconds 300
          Write-Host 'ACCEPTANCE_PHASE note-save-started'
          $shell.SendKeys($body); $shell.SendKeys('^s'); Start-Sleep -Seconds 5
          $newNotes = @(Get-ChildItem -LiteralPath $library -Filter '*.md' -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -notin $before)
          $saved = $newNotes | Where-Object {
            $noteContent = Get-Content -LiteralPath $_.FullName -Raw
            $noteContent.Contains($title) -and $noteContent.Contains($body)
          } | Select-Object -First 1
          if (-not $saved) { throw 'Portable title and body were not saved together in one Markdown file' }
          Write-Host 'ACCEPTANCE_PHASE note-save-verified'
          $noteSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $saved.FullName).Hash
          $shell.SendKeys('%{F4}')
          $running = @()
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $running = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object ExecutablePath -eq $portable)
            if ($running.Count -eq 0) { break }
          }
          if ($running.Count -ne 0) {
            $running | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            throw 'Portable LeafNote did not close normally after UI save'
          }
          Write-Host 'ACCEPTANCE_PHASE app-exit-verified'
          [pscustomobject]@{
            schemaVersion=1; scenario='portable-ui-save'; repo=$env:GITHUB_REPOSITORY
            runId=$env:GITHUB_RUN_ID; headSha=$env:GITHUB_SHA; validationTag=$env:VALIDATION_TAG
            product='LeafNote'; version='1.4.0'; portableSha=$portableSha; signature=$signature.Status.ToString()
            notePath=$saved.FullName; noteSha=$noteSha; titleFound=$true; bodyFound=$true; normalExit=$true
            recordedAt=(Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'portable-evidence.json') -Encoding UTF8
          } finally {
            if ($watchdog -and -not $watchdog.HasExited) { Stop-Process -Id $watchdog.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-evidence-portable
          path: ${{ runner.temp }}\portable-evidence.json
  upgrade:
    needs: prepare-assets
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: none
    env:
      VALIDATION_TAG: ${{ inputs.validation_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-binaries
          path: ${{ runner.temp }}
      - name: Upgrade 1.3.6, verify replacement, and preserve Markdown
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'Note-App-1.3.6-Windows-x64-Setup.exe'
          $new = Join-Path $env:RUNNER_TEMP 'LeafNote-1.4.0-Windows-x64-Setup.exe'
          $oldInstaller = Start-Process -FilePath $old -ArgumentList '/S' -PassThru -Wait
          if ($oldInstaller.ExitCode -ne 0) { throw "1.3.6 installer exit code $($oldInstaller.ExitCode)" }
          $oldEntry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Note App' -and $_.DisplayVersion -eq '1.3.6' } | Select-Object -First 1
          if (-not $oldEntry) { throw 'Note App 1.3.6 installation was not established' }
          $library = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Note App Library'
          New-Item -ItemType Directory -Path $library -Force | Out-Null
          $note = Join-Path $library 'upgrade-acceptance.md'
          Set-Content -LiteralPath $note -Value '# Upgrade acceptance invariant' -Encoding UTF8
          $noteShaBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $note).Hash
          $newInstaller = Start-Process -FilePath $new -ArgumentList '/S' -PassThru -Wait
          if ($newInstaller.ExitCode -ne 0) { throw "LeafNote installer exit code $($newInstaller.ExitCode)" }
          Start-Sleep -Seconds 4
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'LeafNote' -and $_.DisplayVersion -eq '1.4.0' } | Select-Object -First 1
          if (-not $entry) { throw 'Upgrade did not replace registration with LeafNote 1.4.0' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'Note App') { throw 'Old Note App registration remained after upgrade' }
          $noteShaAfterUpgrade = (Get-FileHash -Algorithm SHA256 -LiteralPath $note).Hash
          if ($noteShaAfterUpgrade -ne $noteShaBefore) { throw 'Upgrade changed existing Markdown' }
          if ($entry.UninstallString -match '^"([^"]+)"') { $uninstaller = $Matches[1] } else { $uninstaller = $entry.UninstallString }
          $installDir = Split-Path -Parent $uninstaller
          $app = Get-ChildItem -LiteralPath $installDir -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'unins|uninstall' -and $_.VersionInfo.ProductName -eq 'LeafNote' } |
            Select-Object -First 1
          if (-not $app -or $app.VersionInfo.ProductVersion -ne '1.4.0') { throw 'Upgrade executable metadata mismatch' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Upgraded LeafNote exited early with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
          $noteShaAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath $note).Hash
          if ($noteShaAfter -ne $noteShaBefore) { throw 'Uninstall changed or deleted Markdown' }
          [pscustomobject]@{
            schemaVersion=1; scenario='upgrade-1.3.6-to-1.4.0-uninstall'; repo=$env:GITHUB_REPOSITORY
            runId=$env:GITHUB_RUN_ID; headSha=$env:GITHUB_SHA; validationTag=$env:VALIDATION_TAG
            oldDisplayName=$oldEntry.DisplayName; oldDisplayVersion=$oldEntry.DisplayVersion
            newDisplayName=$entry.DisplayName; newDisplayVersion=$entry.DisplayVersion
            oldSetupSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash
            newSetupSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $new).Hash
            oldInstallerExitCode=$oldInstaller.ExitCode; newInstallerExitCode=$newInstaller.ExitCode
            uninstallerExitCode=$uninstall.ExitCode; notePath=$note
            noteShaBefore=$noteShaBefore; noteShaAfterUpgrade=$noteShaAfterUpgrade; noteShaAfter=$noteShaAfter
            markdownPreserved=$true; recordedAt=(Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'upgrade-evidence.json') -Encoding UTF8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-evidence-upgrade
          path: ${{ runner.temp }}\upgrade-evidence.json